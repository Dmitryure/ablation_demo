modalities:
  - rgb
  - rppg
  - eye_gaze
  - face_mesh
  - depth
  - fft
  - stft
frames:
  default: 32
image_size: 224
face_crop:
  enabled: true
  backend: opencv_haar
  detection_frequency: 16
  large_box_coef: 1.5
  fallback: full_frame
dim: 256
seed: 0
device: cuda
training:
  run:
    dataset_root: /mnt/d/final_dataset
    cache_dir: /mnt/d/final_cache/v2
    output_dir: runs/v2_no_fau_with_v1_rppg_eye_gaze_rich_v1
    modalities:
      - rgb
      - rppg
      - eye_gaze
      - face_mesh
      - depth
      - fft
      - stft
    modality_permutations: none
    round_ladder: large
    round_targets: null
    eval_count_per_split: 500
    balanced_total: null
    train_ratio: 0.8
    val_ratio: 0.1
    batch_size: 8
    extract_batch_size: 4
    progress_every: 25
    epochs: 30
    lr: 0.001
    weight_decay: 0.01
    modality_lr: null
    modality_dropout: null
    depth_dropout: null
    gate_entropy_weight: null
    device: cuda
    checkpoint_metric: val_balanced_accuracy
    early_stopping_patience: 6
    early_stopping_min_delta: 0.0
    occlusion_diagnostics: true
    occlusion_splits:
      - val
      - test
    seed: 0
    overwrite_cache: false
    prefer_cached_selection: true
    warm_start_rounds: false
    skip_failures: true
    video_decode_mode: scan
    clip_cache_dir: null
    enable_clip_cache: false
    no_clip_cache: true
    sanity_count: 300
    no_sanity_check: false
    dry_run: false
  cached_loader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  modality_dropout:
    default_probability: 0.0
    modality_probabilities: {}
  gate_entropy_weight: 0.0
fusion:
  type: token_transformer
  num_layers: 4
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.05
  max_time_steps: 64
  checkpoint_path: null
head:
  type: modality_gated_mil
  hidden_dim: 1024
  dropout: 0.15
eye_gaze:
  model_path: models/face_landmarker_v2_with_blendshapes.task
  feature_variant: rich_v1
  feature_dim: 32
  slot_count: 16
rgb:
  frames: 16
  checkpoint_path: checkpoints/mvit_v2_s-ae3be167.pth
  slot_count: 8
rppg:
  frames: 128
  image_size: 128
  checkpoint_path: checkpoints/PURE_PhysNet_DiffNormalized.pth
  slot_count: 24
  clip_sampling: contiguous_center
  input_type: diff_normalized
  face_crop:
    enabled: true
    backend: opencv_haar
    detection_frequency: 16
    use_median_box: true
    large_box_coef: 1.5
    fallback: full_frame
face_mesh:
  slot_count: 24
depth:
  model_id_or_path: models/depth-anything-v2-small-hf
  feature_dim: 384
  slot_count: 4
fft:
  num_bins: 32
  slot_count: 4
stft:
  n_fft: 8
  hop_length: 1
  grid_size: 4
  include_chrominance: false
  slot_count: 4
